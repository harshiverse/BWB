<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vijay — Settings</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 40px auto; color: #1a1a1a; }
    h1 { border-bottom: 3px solid #f15a24; padding-bottom: 8px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input[type="number"] { padding: 6px; width: 100px; }
    button { margin-top: 24px; padding: 8px 16px; background: #f15a24; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .danger { background: #b91c1c; margin-left: 12px; }
    #savedMsg { color: #2e7d32; margin-left: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Vijay — Settings</h1>

  <label for="retentionDays">Auto-delete memory older than (days)</label>
  <input id="retentionDays" type="number" min="1" max="365" />

  <div>
    <button id="saveBtn">Save</button>
    <span id="savedMsg" style="display:none;">Saved.</span>
  </div>

  <hr style="margin: 32px 0;" />

  <p>Permanently erase everything Vijay has stored on this device. This cannot be undone.</p>
  <button id="wipeBtn" class="danger">Wipe all local memory</button>

  <script src="options.js" type="module"></script>
</body>
</html>
